name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bundle the game page into the app
        run: python3 tools/build_web.py

      - name: Build the APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BeatTutor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BeatTutor-apk
          path: BeatTutor.apk

      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" BeatTutor.apk \
            --title "Beat Tutor 1.0.${{ github.run_number }}" \
            --notes "Download BeatTutor.apk on your Android phone and open it to install." \
            --target "${{ github.sha }}" --latest
